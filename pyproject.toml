[project]
name = "salus"
version = "0.3.0"
description = "Universal org nerve agent on FalkorDB"
requires-python = ">=3.11"
dependencies = [
  "falkordb>=1.0.0",
  "mcp>=1.2.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.vercel]
entrypoint = "salus.api:app"
