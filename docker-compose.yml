services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: salus-falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - salus_falkor_data:/data
    restart: unless-stopped

  web:
    build: .
    container_name: salus-web
    ports:
      - "8080:8080"
    environment:
      FALKOR_HOST: falkordb
      FALKOR_PORT: "6379"
      SALUS_TENANT: acme
      SALUS_ENV: ${SALUS_ENV:-development}
      SALUS_API_KEY: ${SALUS_API_KEY:-salus-dev-change-me}
      SALUS_ADMIN_KEY: ${SALUS_ADMIN_KEY:-}
      SALUS_CORS_ORIGINS: ${SALUS_CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      SALUS_ALLOWED_HOSTS: ${SALUS_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  salus_falkor_data:
